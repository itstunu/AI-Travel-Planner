<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AI Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">✈️ AI Travel Planner - Admin</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Back to Planner</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Add New City</h5>
                    </div>
                    <div class="card-body">
                        <form id="addCityForm">
                            <div class="mb-3">
                                <label for="cityName" class="form-label">City Name</label>
                                <input type="text" class="form-control" id="cityName" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Add City</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Add New Route</h5>
                    </div>
                    <div class="card-body">
                        <form id="addRouteForm">
                            <div class="mb-3">
                                <label for="routeSource" class="form-label">From City</label>
                                <select class="form-select" id="routeSource" required>
                                    <option value="">Select source</option>
                                    {% for city in cities %}
                                    <option value="{{ city.name }}">{{ city.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="routeDestination" class="form-label">To City</label>
                                <select class="form-select" id="routeDestination" required>
                                    <option value="">Select destination</option>
                                    {% for city in cities %}
                                    <option value="{{ city.name }}">{{ city.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="routeCost" class="form-label">Cost ($)</label>
                                    <input type="number" class="form-control" id="routeCost" 
                                           required min="0" step="0.01">
                                </div>
                                <div class="col-md-6">
                                    <label for="routeTime" class="form-label">Time (min)</label>
                                    <input type="number" class="form-control" id="routeTime" 
                                           required min="0">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="routeDistance" class="form-label">Distance (km)</label>
                                    <input type="number" class="form-control" id="routeDistance" 
                                           required min="0" step="0.01">
                                </div>
                                <div class="col-md-6">
                                    <label for="routeRating" class="form-label">Rating (0-5)</label>
                                    <input type="number" class="form-control" id="routeRating" 
                                           min="0" max="5" step="0.1" value="4.0">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Add Route</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div id="adminMessage" class="alert" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
